<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AXIOM // GENESIS</title>
    <style>
        :root { --bg: #000; --glow: #00ffb4; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #os { position: fixed; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; pointer-events: none; }
        .data-stream { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--glow); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div id="os"><div class="data-stream">Manifold_Density: <span id="idx">1</span> / 523</div></div>

    <script type="module">
        const c = document.getElementById('stage'), gl = c.getContext('webgl', { antialias: true, preserveDrawingBuffer: true });
        const idxOut = document.getElementById('idx');

        const S = (t, s) => { const r = gl.createShader(t); gl.shaderSource(r, s); gl.compileShader(r); return r; };
        const P = gl.createProgram();

        const VS = `attribute float i;uniform mat4 m;uniform float t,l;varying float vR,vO;void main(){float PHI=1.6180339887,TAU=6.2831853071,RHO=14.134725;if(i>l){gl_Position=vec4(0.0);return;}float r=sqrt(i)*4.5,a=i*(TAU/(PHI*PHI)),c=sin(log(r+1.0)*RHO)*0.9,f=a+c+(t*0.1);vR=r/110.0;vO=smoothstep(l-20.0,l,i);vec3 p=vec3(cos(f)*r,sin(t+i*0.1)*1.5*vO,sin(f)*r);gl_Position=m*vec4(p,1.0);gl_PointSize=(28.0+sin(t*2.0+i)*6.0)*(45.0/gl_Position.w);}`;
        const FS = `precision lowp float;varying float vR,vO;void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;vec3 cl=mix(vec3(0.0,1.0,0.7),vec3(0.2,0.5,1.0),vR);float g=exp(-d*6.0)*7.0*(0.4+0.6*vO);gl_FragColor=vec4(cl*g,g);}`;

        gl.attachShader(P, S(gl.VERTEX_SHADER, VS)); gl.attachShader(P, S(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(P); gl.useProgram(P);

        const d = new Float32Array(523); for(let j=0; j<523; j++) d[j] = j + 1;
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW);

        const iL = gl.getAttribLocation(P, 'i'), mL = gl.getUniformLocation(P, 'm'), tL = gl.getUniformLocation(P, 't'), lL = gl.getUniformLocation(P, 'l');
        gl.enableVertexAttribArray(iL); gl.vertexAttribPointer(iL, 1, gl.FLOAT, false, 0, 0);

        let lim = 1, rx = 0.5, ry = 0;
        const tick = (ts) => {
            const time = ts * 0.001, w = window.innerWidth * devicePixelRatio, h = window.innerHeight * devicePixelRatio;
            if(c.width !== w) { c.width = w; c.height = h; gl.viewport(0, 0, w, h); }
            
            gl.clear(gl.COLOR_BUFFER_BIT); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
            if(lim < 523) { lim += (1.0 + (lim/80.0)); idxOut.innerText = Math.floor(Math.min(lim, 523)); }

            const f = 1.0/Math.tan(1.5/2), as = w/h;
            const p = [f/as,0,0,0, 0,f,0,0, 0,0,-1,-1, 0,0,-0.2,0];
            const cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry);
            const v = [cy,sx*sy,-cx*sy,0, 0,cx,sx,0, sy,-sx*cy,cx*cy,0, 0,-12,-115,1];
            const r = new Float32Array(16);
            for(let i=0; i<4; i++) for(let j=0; j<4; j++) for(let k=0; k<4; k++) r[i*4+j] += v[i*4+k] * p[k*4+j];

            gl.uniformMatrix4fv(mL, false, r); gl.uniform1f(tL, time); gl.uniform1f(lL, lim);
            gl.drawArrays(gl.POINTS, 0, 523); requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);

        let dn = false, ox, oy;
        window.onpointerdown = e => { dn = true; ox = e.clientX; oy = e.clientY; };
        window.onpointermove = e => { if(!dn) return; ry += (e.clientX - ox) * 0.005; rx += (e.clientY - oy) * 0.005; ox = e.clientX; oy = e.clientY; };
        window.onpointerup = () => dn = false;
    </script>
</body>
</html>
